{% set name = "qpsolvers" %}
{% set version = "4.12.0" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2ec9c46294ae02bdac8969352726d2c2d5ed85f00c096881b27909e4f103ca7c

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python 
    - flit-core >=2,<4
  run:
    - python
    - numpy >=1.15.4
    - scipy >=1.1.0
    # Be solid with conda-forge and move following solvers from run_constrained to run:
    - scs >=3.2.0
  run_constrained:
    # qpsolvers works with the following solvers:
    - clarabel >=0.4.1
    - coptpy >=7.0.0
    - cvxopt >=1.2.6
    - daqp >=0.8.2
    - kvxopt >=1.3.2
    - ecos >=2.0.8
    - gurobipy >=9.5.2
    - highspy >=1.1.2.dev3,<1.14.0
    - jaxopt >=0.8.3
    - cvxopt >=1.2.6
    - mosek >=10.0.40
    - osqp >=0.6.2
    - piqp >=0.2.2
    - proxsuite >=0.2.9
    - qpalm >=1.2.1
    - pyqpmad >=1.4.0.post3
    - qpax>=0.0.9
    - qtqp >=0.0.3
    - quadprog >=0.1.11
    - sip-python >=0.0.2

test:
  imports:
    - qpsolvers
  commands:
    - pip check
    - python -c "import qpsolvers; print(qpsolvers.available_solvers)"
  requires:
    - pip

about:
  home: https://github.com/stephane-caron/qpsolvers
  summary: Quadratic Programming solvers for Python with a unified API
  license: LGPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
